services:
  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://gateway:gateway@postgres:5432/gateway?sslmode=disable
      REDIS_ADDR: redis:6379
      # Sourced from .env (gitignored, not committed). A real deployment
      # must use actual secret management instead.
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      DASHBOARD_ORIGIN: http://localhost:5173
    depends_on:
      backend:
        condition: service_started
      backend2:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    image: hashicorp/http-echo
    command: ["-listen=:9001", "-text=hello from backend"]
    ports:
      - "9001:9001"

  backend2:
    image: hashicorp/http-echo
    command: ["-listen=:9002", "-text=hello from backend2"]
    ports:
      - "9002:9002"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 2s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
